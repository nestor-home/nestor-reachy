name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: nestor-reachy
    steps:
      - uses: actions/checkout@v7
        with:
          path: nestor-reachy
      # Sibling checkouts: the SDK (path dependency) and the server (dev-only, conformance suite).
      - uses: actions/checkout@v7
        with:
          repository: nestor-home/nestor-satellite-python
          path: nestor-satellite-python
      - uses: actions/checkout@v7
        with:
          repository: nestor-home/nestor
          path: nestor
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      # Not the `reachy` extra: the Reachy SDK conflicts with the dev group (see AGENTS.md).
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest
