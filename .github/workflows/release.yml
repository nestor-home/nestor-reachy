# Release pull request on every push to main; when it is merged, publishes the package to PyPI
# through trusted publishing (environment `pypi`).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: nestor-home/.github/.github/workflows/release-please.yml@main
    secrets: inherit
    with:
      automerge: true  # publish as soon as a release is ready: dependencies follow on their own

  pypi:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish --trusted-publishing always
